name: Generate Doxygen Docs

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  doxygen:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache Doxygen install
        id: cache-doxygen
        uses: actions/cache@v4
        with:
          path: C:\Program Files\doxygen
          key: doxygen-install-${{ runner.os }}-v1

      - name: Install Doxygen via Chocolatey
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: choco install doxygen.install -y --no-progress

      - name: Add Doxygen to PATH
        run: echo "C:\\Program Files\\doxygen\\bin" >> $env:GITHUB_PATH

      - name: Generate Doxygen documentation with pas2dox
        shell: bash
        run: |
          VER=$(awk -F"'" '/DWF_SERVER_VERSION/ {print $2; exit}' source/djGlobal.pas)
          echo "Building documentation for version: $VER"
          ( cat make/doxygen.cfg; echo "PROJECT_NUMBER=$VER" ) | doxygen -

      - name: Upload Doxygen warnings
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-warnings
          path: warnings.log

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          force_orphan: true
