name: Unit tests

on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  fpc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout daraja-framework
        uses: actions/checkout@v4
        with:
          path: daraja-framework

      - name: Checkout Indy (dependency)
        uses: actions/checkout@v4
        with:
          repository: IndySockets/Indy
          path: Indy

      - name: Checkout slf4p (dependency)
        uses: actions/checkout@v4
        with:
          repository: michaelJustin/slf4p
          path: slf4p

      - name: Install GTK2 development files (Linux LCL link dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk2.0-dev

      - name: Install Lazarus / FPC
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      # DARAJA_SKIP_SERVER_TESTS excludes the loopback-HTTP-server integration
      # suites (TSessionTests, TAPIConfigTests) to keep the CI run fast. Their
      # coverage is exercised by the local run-fpc / run-delphi scripts.
      - name: Build the test runner (Console build mode)
        working-directory: daraja-framework/test/unittests
        run: lazbuild -B --build-mode=Console --opt=-dDARAJA_SKIP_SERVER_TESTS Unittests.lpi
        shell: bash

      # The runner links the LCL through the Interfaces unit, whose
      # initialization opens the (gtk2) display even though no window is
      # shown, so on Linux it runs under xvfb. FPC keeps the .exe suffix
      # from the project's target filename on every platform.
      - name: Run the test suite (headless)
        working-directory: daraja-framework/test/unittests
        shell: bash
        run: |
          exe=./UnittestsConsole
          [ -f "$exe.exe" ] && exe="$exe.exe"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum "$exe" --all --format=plain
          else
            "$exe" --all --format=plain
          fi
