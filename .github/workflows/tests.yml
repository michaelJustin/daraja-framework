name: Unit tests

on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  fpc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout daraja-framework
        uses: actions/checkout@v4
        with:
          path: daraja-framework

      - name: Checkout Indy (dependency)
        uses: actions/checkout@v4
        with:
          repository: IndySockets/Indy
          path: Indy

      - name: Checkout slf4p (dependency)
        uses: actions/checkout@v4
        with:
          repository: michaelJustin/slf4p
          path: slf4p

      # On Linux, install from the Ubuntu archive (FPC 3.2.2 + Lazarus).
      # The setup-lazarus action pulls .deb files from SourceForge, which
      # regularly stalls for many minutes on the hosted runners.
      - name: Install FPC and Lazarus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lazarus libgtk2.0-dev

      # On Windows the setup-lazarus action installs Lazarus + FPC from the
      # SourceForge Windows installer into ${RUNNER_TEMP}/installers/lazarus,
      # which also stalls for many minutes when SourceForge throttles the
      # runners. Cache that tree (it is self-contained, including its own
      # fpc.cfg) and skip the download on a hit. Bump the key suffix when the
      # Lazarus / FPC version changes.
      - name: Cache Lazarus / FPC (Windows)
        if: runner.os == 'Windows'
        id: cache-lazarus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/installers/lazarus
          key: lazarus-${{ runner.os }}-stable-4.4-fpc-3.2.2

      - name: Install Lazarus / FPC (Windows)
        if: runner.os == 'Windows' && steps.cache-lazarus.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      # On a cache hit setup-lazarus did not run, so add the same two
      # directories it would have put on PATH (the IDE/lazbuild dir and the
      # bundled FPC bin dir).
      - name: Add cached Lazarus to PATH (Windows)
        if: runner.os == 'Windows' && steps.cache-lazarus.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/installers/lazarus" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/installers/lazarus/fpc/3.2.2/bin/x86_64-win64" >> "$GITHUB_PATH"

      # The ConsoleCI build mode is the Console mode plus
      # -dDARAJA_SKIP_SERVER_TESTS, which excludes the loopback-HTTP-server
      # integration suites (TSessionTests, TAPIConfigTests) to keep the CI
      # run fast. Their coverage is exercised by the local run-fpc /
      # run-delphi scripts. The define lives in the build mode rather than a
      # lazbuild --opt flag because Lazarus 3.0's lazbuild rejects --opt.
      - name: Build the test runner (ConsoleCI build mode)
        working-directory: daraja-framework/test/unittests
        run: lazbuild -B --build-mode=ConsoleCI Unittests.lpi
        shell: bash

      # The runner links the LCL through the Interfaces unit, whose
      # initialization opens the (gtk2) display even though no window is
      # shown, so on Linux it runs under xvfb. FPC adds the .exe suffix on
      # Windows only.
      - name: Run the test suite (headless)
        working-directory: daraja-framework/test/unittests
        shell: bash
        run: |
          exe=./UnittestsConsoleCI
          [ -f "$exe.exe" ] && exe="$exe.exe"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum "$exe" --all --format=plain
          else
            "$exe" --all --format=plain
          fi
